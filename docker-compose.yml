services:
  prod:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: youtubei-api-prod
    ports:
      - "3000:3000"
    environment:
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
      - YOUTUBE_COOKIES_FILE=/app/youtube_cookies.txt
    env_file:
      - .env
    volumes:
      - ./youtube_cookies.txt:/app/youtube_cookies.txt
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/hello"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

